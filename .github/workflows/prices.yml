name: Update prices

on:
  # Weekdays only, at 09:30, 13:30 and 17:35 Madrid time. GitHub cron runs in UTC, so each slot
  # is listed for both summer (UTC+2) and winter (UTC+1) time; the "Madrid time" step below
  # skips the run that falls in the wrong hour. GitHub can start scheduled runs a few minutes late.
  schedule:
    - cron: "30 7 * * 1-5"    # 09:30 Madrid in summer (UTC+2)
    - cron: "30 8 * * 1-5"    # 09:30 Madrid in winter (UTC+1)
    - cron: "30 11 * * 1-5"   # 13:30 summer
    - cron: "30 12 * * 1-5"   # 13:30 winter
    - cron: "35 15 * * 1-5"   # 17:35 summer
    - cron: "35 16 * * 1-5"   # 17:35 winter
  workflow_dispatch:

permissions:
  contents: write
  id-token: write   # lets npm trusted publishing work without a token

concurrency:
  group: prices
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Madrid time
        id: gate
        env:
          CRON: ${{ github.event.schedule }}
        run: |
          # Run only the entry that matches Madrid's current offset; a late start doesn't matter.
          OFF=$((10#$(TZ=Europe/Madrid date +%z | cut -c2-3)))
          if [ -z "$CRON" ]; then echo "go=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          UTC_H=$(echo "$CRON" | awk '{print $2}')
          SLOT=$(( (UTC_H + OFF) % 24 ))
          echo "cron '$CRON' -> Madrid slot ${SLOT}h (now $(TZ=Europe/Madrid date +%H:%M))"
          case "$SLOT" in 9|13|17) echo "go=true" >> "$GITHUB_OUTPUT";; *) echo "go=false" >> "$GITHUB_OUTPUT"; echo "Other season's entry; skipping.";; esac
      - uses: actions/checkout@v4
        if: steps.gate.outputs.go == 'true'
      - uses: actions/setup-python@v5
        if: steps.gate.outputs.go == 'true'
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        if: steps.gate.outputs.go == 'true'
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Fetch prices
        if: steps.gate.outputs.go == 'true'
        run: python scripts/fetch_prices.py

      - name: Commit if changed
        if: steps.gate.outputs.go == 'true'
        id: commit
        run: |
          git config user.name "price-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add prices.json prices.js
          if git diff --cached --quiet; then echo "changed=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          git commit -m "Update prices"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Publish to npm (served to the dashboard by jsDelivr and unpkg)
        # Uses npm trusted publishing (OIDC, no token). Token publishes from CI are only staged for
        # manual approval on npmjs.com, which would stop the automatic updates.
        if: steps.gate.outputs.go == 'true' && (steps.commit.outputs.changed == 'true' || github.event_name == 'workflow_dispatch')
        run: |
          npm install -g npm@latest --silent
          V="1.$(date -u +%Y%m%d).$((10#$(date -u +%H%M)))"
          npm version "$V" --no-git-tag-version --allow-same-version
          set +e
          npm publish --access public --provenance > publish.log 2>&1
          rc=$?
          set -e
          cat publish.log
          # Keep a short public status note (no secrets) so problems can be diagnosed later.
          { echo "run: $(date -u +%FT%TZ)"; echo "version: $V"; echo "exit: $rc"; tail -n 15 publish.log; } > status.txt
          git checkout -- package.json
          git add status.txt
          git commit -q -m "Publish status" && git push -q || true
          exit $rc

      - name: Refresh CDN copies
        if: success() && steps.gate.outputs.go == 'true'
        run: |
          for u in "npm/amozz10-market-prices@1/prices.js" "npm/amozz10-market-prices@latest/prices.js" "npm/amozz10-market-prices/prices.js"; do
            curl -sS -m 30 "https://purge.jsdelivr.net/$u" > /dev/null || true
          done
